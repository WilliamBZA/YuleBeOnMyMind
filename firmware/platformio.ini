; Yule Be On My Mind - decoration firmware
;
;   pio run                 build the default board (esp32dev)
;   pio run -e esp32-c3     build for an ESP32-C3 board
;   pio run -e bringup      breadboard bring-up build: no networking (README, "Hardware bring-up")
;   pio test -e native      run the host-side unit tests for lib/yule_core
;
; Platform: the official PlatformIO "espressif32" platform still ships Arduino-ESP32 2.x, so this project
; uses the community pioarduino platform, which tracks Arduino-ESP32 3.x on ESP-IDF 5 (design D2).
; Core-version-specific APIs (LEDC, OTA rollback hooks) are confined to src/*_driver.* and src/ota_client.*.

[platformio]
default_envs = esp32dev

[common]
; Firmware version. Bump this for every release (see README "Releasing firmware").
fw_version = 0.1.0
lib_deps =
    bblanchon/ArduinoJson@7.4.2

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
; Two OTA app slots of about 1.9 MB each (design D2); see partitions.csv.
board_build.partitions = partitions.csv
board_upload.flash_size = 4MB
board_build.flash_size = 4MB
lib_deps =
    ${common.lib_deps}
    fastled/FastLED@3.10.3
    tzapu/WiFiManager@2.0.17
build_flags =
    -DYULE_FW_VERSION=\"${common.fw_version}\"
; Warnings apply to our own sources only; third-party libraries are noisy.
build_src_flags =
    -Wall
    -Wextra
; Gzips web/index.html into include/generated/web_index.h before every build (design D7), and signs the image
; into dist/ after it when YULE_SIGNING_KEY names the release private key (design D13, README "Releasing firmware").
extra_scripts =
    pre:scripts/embed_web.py
    post:scripts/sign_firmware.py

[env:esp32dev]
extends = esp32_base
board = esp32dev
build_flags =
    ${esp32_base.build_flags}
    -DYULE_BOARD_ID=\"esp32dev\"

; The default board without any networking, for checking the LEDs, buzzer and button on the breadboard:
; a short press plays the owner's own song and pattern, a long press toggles mute.
[env:bringup]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DYULE_BRINGUP=1

[env:esp32-c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
    ${esp32_base.build_flags}
    -DYULE_BOARD_ID=\"esp32-c3\"
    -DYULE_PIN_LED=4
    -DYULE_PIN_BUZZER=5d
    -DYULE_PIN_BUTTON=6

[env:esp32-s3]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_base.build_flags}
    -DYULE_BOARD_ID=\"esp32-s3\"
    -DYULE_PIN_LED=5
    -DYULE_PIN_BUZZER=6
    -DYULE_PIN_BUTTON=7

; Host-side tests of the hardware-independent core (lib/yule_core). Needs a host C++17 compiler.
[env:native]
platform = native
test_framework = unity
lib_deps = ${common.lib_deps}
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DYULE_NATIVE=1
