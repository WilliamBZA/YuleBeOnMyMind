# Mosquitto configuration for Yule Be On My Mind (design D5).
#
# Authentication and authorisation are handled entirely by the dynamic-security plugin. The Yule server
# manages its clients, roles and ACLs live over MQTT, so no restart or reload is needed for changes.

# Nothing is allowed without a login. Per-client permissions then come from dynamic security.
allow_anonymous false

# ---- Dynamic security -----------------------------------------------------------------------------------
# The plugin's state lives on the data volume. Create it once with `mosquitto_ctrl dynsec init` (README).
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json

# ---- Persistence ----------------------------------------------------------------------------------------
# Devices connect with clean_session=false so presses sent during a short outage or an update reboot are
# queued. These limits keep a long-offline device from holding memory forever.
persistence true
persistence_location /mosquitto/data/
persistent_client_expiration 2h
max_queued_messages 20
max_packet_size 4096

# ---- Logging --------------------------------------------------------------------------------------------
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# ---- Listeners ------------------------------------------------------------------------------------------
# Public: TLS only. Compose publishes this on the non-standard host port (MQTT_TLS_PORT in .env).
listener 8883
protocol mqtt
certfile /etc/yule/certs/fullchain.pem
keyfile /etc/yule/certs/privkey.pem
tls_version tlsv1.2

# Internal: plain MQTT for the Yule server. Compose does not publish this port, so it is reachable only from
# other containers on the internal network.
listener 1883
protocol mqtt
